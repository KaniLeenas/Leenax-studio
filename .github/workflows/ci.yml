# Leenax Studio checks (E10). Runs on every push and pull request. Nothing is deployed from here:
# deploy.yml deploys main to the server after these pass.
# The SQL suites use a throwaway PostgreSQL service in the runner, never a real database.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: FFmpeg (the render checks run it, as in backend/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build and unit tests
        working-directory: backend
        run: mvn -B -ntp verify 2>&1 | tee "$RUNNER_TEMP/backend.log"; exit "${PIPESTATUS[0]}"
      - name: Report why the build failed
        if: failure()
        run: |
          bash scripts/ci-annotate.sh "$RUNNER_TEMP/backend.log" "backend build" '^\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|FAILURE|<<< (FAILURE|ERROR)'
          for f in backend/target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && bash scripts/ci-annotate.sh "$f" "failed test $(basename "$f" .txt)" 'Tests run|FAILURE|ERROR|expected|Exception|at com\.leenax'
          done
          true

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leenax
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: leenax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leenax" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only
      LEENAX_TEST_DSN: host=localhost port=5432 user=leenax password=ci-only dbname=leenax_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply every migration to an empty database
        working-directory: backend/src/main/resources/db/migration
        run: |
          set -o pipefail
          for f in $(ls V*.sql | sort -V); do
            echo "$f"
            psql -h localhost -U leenax -d leenax_test -v ON_ERROR_STOP=1 -q -f "$f" 2>&1 | tee -a "$RUNNER_TEMP/migrations.log"
          done
      - name: SQL suites (row-level security, approval gates, authorisation records, the whole workflow)
        run: |
          pip install "psycopg[binary]==3.2.*"
          set -o pipefail
          bash backend/src/test/sql/run_all.sh 2>&1 | tee "$RUNNER_TEMP/sql.log"
      - name: Report why the database checks failed
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/migrations.log" ] && bash scripts/ci-annotate.sh "$RUNNER_TEMP/migrations.log" "migrations" 'ERROR|FATAL|V[0-9]+__'
          [ -f "$RUNNER_TEMP/sql.log" ] && bash scripts/ci-annotate.sh "$RUNNER_TEMP/sql.log" "SQL suites" 'FAIL|Error|error|Traceback|==|checks passed'
          true

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test
          npm run build
          npm audit --audit-level=high

  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - working-directory: renderer
        run: |
          npm ci
          npm test

  docservice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: OCR, office and font packages (as in docservice/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam \
            libreoffice-writer-nogui libreoffice-impress-nogui fonts-noto-core fonts-dejavu-core fonts-liberation2 fonts-crosextra-carlito
      - name: Tests
        working-directory: docservice
        run: |
          pip install -r requirements-test.txt
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee "$RUNNER_TEMP/docservice.log"
      - name: Report why the tests failed
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/docservice.log" ] && bash scripts/ci-annotate.sh "$RUNNER_TEMP/docservice.log" "docservice tests" 'FAILED|Error|assert|passed|failed'
          true

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: No keys or tokens in the repository
        run: |
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|^-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key": *"-----BEGIN|ya29\.[0-9A-Za-z_-]{20,}|GOCSPX-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' -- . ':!*.lock' ':!*package-lock.json'; then
            echo "Something that looks like a secret is committed. Remove it and rotate the key."; exit 1
          fi
