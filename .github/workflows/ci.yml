# Leenax Studio checks (E10). Runs on every push and pull request; nothing is deployed from here.
# The SQL suites use a throwaway PostgreSQL service in the runner, never a real database.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit tests
        working-directory: backend
        run: mvn -B -ntp verify

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leenax
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: leenax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leenax" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only
      LEENAX_TEST_DSN: host=localhost port=5432 user=leenax password=ci-only dbname=leenax_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply every migration to an empty database
        working-directory: backend/src/main/resources/db/migration
        run: |
          for f in $(ls V*.sql | sort -V); do
            echo "$f"
            psql -h localhost -U leenax -d leenax_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: SQL suites (row-level security, approval gates, authorisation records, the whole workflow)
        run: |
          pip install "psycopg[binary]==3.2.*"
          backend/src/test/sql/run_all.sh

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test
          npm run build
          npm audit --audit-level=high

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - working-directory: desktop
        run: |
          npm ci
          npm test
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: leenax-studio-windows-installer
          path: desktop/dist/*.exe

  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: renderer
        run: |
          npm ci
          npm test

  docservice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OCR, office and font packages (as in docservice/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-tam \
            libreoffice-writer-nogui libreoffice-impress-nogui fonts-noto-core fonts-dejavu-core fonts-liberation2 fonts-crosextra-carlito
      - working-directory: docservice
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No keys or tokens in the repository
        run: |
          if git grep -nE 'sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|^-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key": *"-----BEGIN|ya29\.[0-9A-Za-z_-]{20,}|GOCSPX-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' -- . ':!*.lock' ':!*package-lock.json'; then
            echo "Something that looks like a secret is committed. Remove it and rotate the key."; exit 1
          fi
