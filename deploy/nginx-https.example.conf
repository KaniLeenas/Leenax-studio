# Example host Nginx config for putting Leenax Studio on the internet with HTTPS.
# Two hostnames point at your server:
#   studio.example.com  -> the app (web container on 127.0.0.1:8088)
#   media.example.com   -> signed media URLs (storage container on 127.0.0.1:8333)
#
# Get certificates first, e.g.:
#   sudo certbot certonly --nginx -d studio.example.com -d media.example.com
# Then set in .env:  COOKIE_SECURE=true   MEDIA_PUBLIC_URL=https://media.example.com

server {
    listen 80;
    server_name studio.example.com media.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name studio.example.com;

    ssl_certificate     /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2100m;

    # Live generation progress (Server-Sent Events) must not be buffered.
    location = /api/v1/ai/generation/events {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Only signed GET/HEAD requests for media; uploads always go through the backend.
    limit_except GET HEAD { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8333;
        # Signed URLs are signed for this host name, so pass it through unchanged.
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
