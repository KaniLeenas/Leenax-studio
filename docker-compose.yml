# Leenax AI Video Studio — Phase 1 stack
# Start:   docker compose up -d --build
# Open:    http://localhost:8088
name: leenax

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leenax
      POSTGRES_USER: leenax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local access only (for DB tools and running the backend outside Docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leenax -d leenax"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Private S3-compatible object storage (SeaweedFS; MinIO no longer ships Docker images).
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - storagedata:/data
      - ./deploy/seaweedfs-entrypoint.sh:/init/seaweedfs-entrypoint.sh:ro
    ports:
      - "127.0.0.1:8333:8333"   # S3 API; browsers fetch signed media URLs from here

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/leenax
      DB_USERNAME: leenax
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      LEENAX_MASTER_KEY: ${LEENAX_MASTER_KEY:?set LEENAX_MASTER_KEY in .env (openssl rand -base64 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_ENDPOINT: http://storage:8333
      S3_PUBLIC_ENDPOINT: ${MEDIA_PUBLIC_URL:-http://localhost:8333}
      S3_BUCKET: leenax-media
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "true"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2GB}
      IMAGETOOLS_URL: http://imagetools:7000
      RENDERER_URL: http://renderer:7100
      # E2: course documents are read (text + English/Tamil OCR) by the docservice below.
      DOCSERVICE_URL: http://docservice:7200
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-104857600}
      # E6: YouTube SEO research budget and score weights.
      SEO_DAILY_SEARCHES: ${SEO_DAILY_SEARCHES:-100}
      SEO_CACHE_DAYS: ${SEO_CACHE_DAYS:-7}
      RENDERER_TOKEN: ${RENDERER_TOKEN:?set RENDERER_TOKEN in .env (any long random string)}
      # Social publishing (Phase 6). A platform with blank credentials shows as "not set up".
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      YOUTUBE_REACH_IMPORT_CRON: ${YOUTUBE_REACH_IMPORT_CRON:-0 20 14 * * *}
      # Phase 7: the System page reads the backup service's status from here.
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Background removal for the Thumbnail Studio (rembg). Private: no published port.
  # Remove this service (and IMAGETOOLS_URL above) if you don't need it; the rest keeps working.
  imagetools:
    build: ./imagetools
    restart: unless-stopped
    mem_limit: 2g

  # Reads course documents (E2): PDF text, Word/PowerPoint via LibreOffice, and OCR in
  # English and Tamil with Tesseract. Private: no published port, no outside calls.
  # Without it, uploads are kept and wait in the queue until it runs.
  docservice:
    build: ./docservice
    restart: unless-stopped
    mem_limit: ${DOCSERVICE_MEMORY:-2g}
    environment:
      OCR_LANGUAGES: eng+tam
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}

  # Video exports from the editor (Remotion + headless Chrome). Private: no published port.
  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    restart: unless-stopped
    environment:
      RENDERER_TOKEN: ${RENDERER_TOKEN}
    shm_size: 1gb            # Chrome needs more shared memory than Docker's 64 MB default
    mem_limit: ${RENDERER_MEMORY:-4g}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8333}
      MAX_UPLOAD_SIZE_NGINX: ${MAX_UPLOAD_SIZE_NGINX:-2100m}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"

  # Daily database + media backups into ./backups (see README, Backups). Remove this service to turn them off.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/init/backup-loop.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Colombo}
      BACKUP_TIME: ${BACKUP_TIME:-03:15}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - storagedata:/media-data:ro
      - ./deploy/backup-loop.sh:/init/backup-loop.sh:ro

volumes:
  pgdata:
  redisdata:
  storagedata:
